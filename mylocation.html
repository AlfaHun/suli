<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS másoló</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        #status {
            margin-top: 15px;
            color: green;
        }
    </style>
</head>
<body>

    <h2>GPS koordináta másolása</h2>

    <input id="textInput"
           type="text"
           placeholder="Írj ide valamit">

    <button onclick="copyLocation()">
        GPS lekérése és másolás
    </button>

    <div id="status"></div>

    <textarea id="result"
          rows="4"
          style="width:100%; margin-top:10px;"
          readonly>
    </textarea>
    
<button onclick="copyResult()">Másolás</button>

    
    <script>
        async function copyLocation() {

            const text = document.getElementById("textInput").value;
            const status = document.getElementById("status");

            if (!navigator.geolocation) {
                status.innerText = "A geolocation nem támogatott.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
    async (position) => {

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const result =
            text
            ? `${text}\t${lat},${lon}`
            : `${lat},${lon}`;

        document.getElementById("result").value = result;

        try {
            await navigator.clipboard.writeText(result);
            status.innerText = "Vágólapra másolva.";
        }
        catch (err) {
            status.innerText =
                "A vágólapra másolás nem sikerült, de a szöveg lent látható.";
        }
    },
    (error) => {
        status.innerText =
            "Nem sikerült lekérni a GPS pozíciót.";
    }
);

        }

async function copyResult() {
    const text = document.getElementById("result").value;

    try {
        await navigator.clipboard.writeText(text);
        alert("Másolva.");
    }
    catch {
        alert("A másolás nem sikerült.");
    }
}        
    </script>

</body>
</html>
